[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudhub-tv3"
version = "0.1.0"
description = "CloudHub environment catalog and deployment workers"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudhub = ["templates/*.json", "catalog/*.json", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
